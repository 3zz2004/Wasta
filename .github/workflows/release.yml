name: Release

# Push a tag like v0.2.0 to publish both packages. Both registries trust this
# workflow directly (trusted publishing), so no tokens are stored anywhere.
on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Publish unless this version is already on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "wasta@$VERSION" version > /dev/null 2>&1; then
            echo "wasta@$VERSION is already on npm, skipping"
          else
            npm publish --access public
          fi

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: node scripts/copy-docs.mjs
      - run: pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
